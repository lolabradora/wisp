<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wisp og:image source (1200x630)</title>
<!-- Source for site/assets/og.png. Render at 1200x630 with headless Chrome; see site/assets/og.png.json. -->
<link rel="stylesheet" href="../../site/assets/style.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { display: flex; flex-direction: column; justify-content: space-between; padding: 64px 72px 72px; }
  .mark { font: 500 34px/1 var(--sans); letter-spacing: -0.04em; color: var(--graphite); display: flex; justify-content: space-between; align-items: baseline; }
  .mark span { font: 400 22px/1 var(--sans); letter-spacing: -0.01em; color: var(--graphite-2); }
  h1 { font: 500 74px/1.04 var(--sans); letter-spacing: -0.04em; max-width: 21ch; text-wrap: balance; margin: 0; }
  .og-term { font-size: 30px; padding: 26px 34px; border-radius: 10px; }
  .og-term .ln { white-space: pre; }
  .og-term .caret { height: 1.2em; }
  .og-term .caret::after { width: 3px; animation: none; }
</style>
</head>
<body>
  <div class="mark">wisp <span>zsh · macOS · Linux · runs locally</span></div>
  <h1>It finishes the names already on your screen.</h1>
  <div class="term og-term">
    <div class="scene has-out has-ghost">
      <div class="ln prompt"><span class="cmd"><span class="live"><span class="ps">$</span> git checkout feat/p<i class="caret"></i><span class="ghost">ayments-refactor</span></span></span></div>
    </div>
  </div>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # The end-to-end test drives a real zsh inside tmux, with and without zsh-autosuggestions.
      - name: Install zsh and tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh tmux zsh-autosuggestions
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux zsh-autosuggestions

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
        env:
          # A missing tmux or zsh fails the end-to-end test instead of skipping it.
          WISP_E2E_REQUIRE: 1
      - run: zsh -n shell/wisp.zsh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh tests/zsh_e2e.sh
